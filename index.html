<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.groq.com https://api.openai.com https://api.anthropic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순모임 노트</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f2ea; --card:#ffffff; --ink:#1c2621; --muted:#66716b; --line:#e2ded2; --soft:#faf8f3;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e2efe7;
  --warn:#a8522b; --warn-soft:#f9e8df; --rec:#c83a2e; --ok:#2f7a4f;
  --c1:#2f7a9e; --c2:#b0503a; --c3:#6d5aa8; --c4:#2f7a4f; --c5:#b07a1e; --c6:#a83f74; --c7:#3f6f8f; --c8:#5f7a2a;
  --radius:18px; --shadow:0 1px 2px rgba(20,30,25,.05),0 4px 16px rgba(20,30,25,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121614; --card:#1b211e; --ink:#e9eeeb; --muted:#9ba7a0; --line:#2b3430; --soft:#171c19;
    --accent:#72c49b; --accent-ink:#0d1812; --accent-soft:#1f3a2c; --warn:#eba07a; --warn-soft:#3a271e; --rec:#f0685a; --ok:#72c49b;
    --c1:#7cc0e0; --c2:#f0987f; --c3:#b3a3ec; --c4:#80cf9f; --c5:#e8bd6a; --c6:#ec95c0; --c7:#8fb8d6; --c8:#b3cc76;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 120px)}
h2{font-size:18px;margin:0 0 10px;line-height:1.4}
h3{font-size:17px;margin:0}
p{margin:0 0 10px}

button,.btn{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;padding:12px 16px;cursor:pointer;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.big{min-height:62px;font-size:19px;border-radius:18px;width:100%}
button.danger{color:var(--warn);border-color:var(--warn);background:transparent}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
button.icon{min-height:44px;min-width:44px;padding:6px;font-size:24px;border-color:transparent;background:transparent;font-weight:400}
button.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--soft)}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
.card.accent{border-color:var(--accent);background:var(--accent-soft)}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input,textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:100px;resize:vertical}
label.f{display:block;font-size:15px;font-weight:600;margin:14px 0 6px}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.rec{background:var(--rec);color:#fff}
.hidden{display:none!important}
details > summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .2s}
details[open] > summary::after{transform:rotate(90deg)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;flex:none}
@keyframes s{to{transform:rotate(360deg)}}

/* 홈 */
.hero{text-align:center;padding:26px 18px}
.hero .date{font-size:15px;color:var(--muted);font-weight:600}
.hero .title{font-size:24px;font-weight:800;margin:4px 0 18px}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item .d{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}

/* 단계 표시 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px;position:sticky;top:61px;z-index:8;background:var(--bg);padding:6px 0}
.steps button{min-height:52px;flex-direction:column;gap:0;font-size:14px;padding:6px 2px;letter-spacing:-.3px;border-radius:14px;line-height:1.25}
.steps button b{font-size:12px;font-weight:700;color:var(--muted)}
.steps button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.on b{color:inherit;opacity:.85}

/* 파일 올리기 */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:16px;
  padding:26px 16px;text-align:center;cursor:pointer;background:var(--soft);font-weight:600}
.drop input{display:none}
.drop .ic{font-size:34px;line-height:1}

/* 녹음 */
.recbox{display:flex;align-items:center;gap:16px}
.recbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--rec);color:#fff;font-size:17px;font-weight:800;flex:none;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 18%,transparent)}
.recbtn.on{border-radius:24px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--rec) 10%,transparent)}}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;line-height:1.1}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.speakers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.speakers{grid-template-columns:repeat(3,1fr)}}
.speakers button{min-height:64px;font-size:18px;justify-content:flex-start;padding:10px 14px;position:relative}
.speakers button .dot{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.speakers button.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--card));box-shadow:inset 0 0 0 1.5px var(--pc)}
.speakers button .key{position:absolute;right:10px;top:6px;font-size:12px;color:var(--muted);font-weight:500}
@media (pointer:coarse){.speakers button .key,.kbd{display:none}}
.kbd{font-size:13px;font-weight:500;color:var(--muted)}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchips button{min-height:40px;padding:6px 14px;font-size:15px;border-radius:999px}

/* 노트 (말풍선) */
.notes{display:grid;gap:10px;max-height:60vh;overflow:auto;padding:2px}
.bub{border-left:4px solid var(--pc,var(--line));background:var(--soft);border-radius:4px 14px 14px 4px;padding:8px 12px}
.bub .who{font-weight:700;color:var(--pc,var(--muted));font-size:15px;display:flex;gap:8px;align-items:baseline}
.bub .t{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.bub.low .txt{color:var(--muted)}
.bub select{width:auto;padding:2px 6px;font-size:14px;font-weight:700;color:var(--pc,var(--ink));background:transparent;border:1px dashed var(--line);border-radius:8px}
.seg{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}

/* 하단 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:14px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--bg) 72%,color-mix(in srgb,var(--bg) 0%,transparent))}
.dock > div{max-width:720px;margin:0 auto}

/* 사람 카드 */
.person{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:14px 0;border-top:1px solid var(--line)}
.person.first{border-top:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pc);color:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;grid-row:span 4}
.person h3{white-space:nowrap}
.person .req{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.person .req li{font-size:18px;font-weight:600}
.person .sum{font-size:15px;color:var(--muted);margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;cursor:pointer;user-select:none;color:var(--muted)}
.toggle input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;padding:0;border:0;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:23px}
.toggle input:checked + span{color:var(--ink);font-weight:600}

.prayer{white-space:pre-wrap;font-size:18px;line-height:1.85}
.say{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:16px;margin-bottom:12px}
.say::before{content:"💬 이렇게 말해 보세요";display:block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h2{margin:0;flex:1}
.num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none}

/* 질문 카드 · 내 메모 */
.qcard{border:2px solid var(--accent)}
.qtext{font-size:21px;font-weight:700;line-height:1.5;margin:6px 0 12px}
.mynote{background:var(--soft);border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:17px;line-height:1.7}
.mynote b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.points{margin:8px 0;padding-left:20px;font-size:16px}
.points li{margin:4px 0}
.hintbox{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0}
.hintbox b{display:block;font-size:13px;color:var(--accent)}

/* 크게 보기 */
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 100px)}
.reader .prayer{font-size:26px;line-height:1.9;max-width:760px;margin:0 auto}
.reader h2{max-width:760px;margin:0 auto 16px;font-size:20px;color:var(--muted)}
.reader .close{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);min-width:200px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.reader .zoom{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:6px}

/* 안내 창 · QR */
.sheet{max-width:560px;margin:0 auto}
.sheet h2{color:var(--ink);font-size:22px;margin-bottom:14px}
.steplist{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
.steplist li{counter-increment:st;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 52px;position:relative;font-size:17px}
.steplist li::before{content:counter(st);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.ic-share{display:inline-block;border:1.5px solid currentColor;border-radius:6px;padding:0 5px;font-size:14px}
.qrbox{background:#fff;padding:14px;border-radius:18px;max-width:320px;margin:0 auto;box-shadow:var(--shadow)}
.qrbox svg{display:block;width:100%;height:auto}

/* 설정 마법사 */
.wiz-steps{display:flex;gap:6px;margin-bottom:14px}
.wiz-steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wiz-steps i.on{background:var(--accent)}
.howto{margin:8px 0 0;padding-left:22px;font-size:15px}
.howto li{margin:3px 0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;z-index:40;max-width:min(92vw,560px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.stream{font-size:14px;color:var(--muted)}
.lock{max-width:360px;margin:12vh auto 0;text-align:center}
.lock input{text-align:center;font-size:28px;letter-spacing:10px}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin-top:8px}
.check input{width:auto}
</style>
</head>
<body>
<header>
  <button id="backBtn" class="icon hidden" aria-label="뒤로">‹</button>
  <h1 id="title">순모임 노트</h1>
  <button id="settingsBtn" class="icon" aria-label="설정">⚙︎</button>
</header>
<main id="app"></main>
<div id="dock" class="dock hidden"><div id="dockIn"></div></div>
<div id="reader" class="reader hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
